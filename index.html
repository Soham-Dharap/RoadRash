<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Road Rash (1996 PC Edition) — Made By Soham</title>
    <link rel="preload" href="/og/fonts/badloc.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/og/fonts/futura-bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/og/fonts/futura-demi.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/og/fonts/futura-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="viewport-shell">
        <div id="screen-stage">
          <canvas id="gl-canvas" width="640" height="480"></canvas>
          <canvas id="ui-canvas" width="640" height="480"></canvas>
        </div>

        <div id="top-bar" aria-label="Toolbar">
          <span class="bar-badge">ROAD RASH &bull; Made By Soham</span>
          <span id="controls-hint" class="bar-hint">
            <b>ARROWS/WASD</b> Ride &bull;
            <b>SPACE/Z/C</b> Punch/Club/Chain &bull; <b>X/SHIFT</b> Boot Kick &bull;
            <b>N/CTRL</b> Nitro &bull; <b>F10</b> HUD &bull; <b>ESC</b> Pause
          </span>
          <div class="bar-actions">
            <button id="btn-music" type="button" title="Toggle Rock Music (M = Next Track)">MUSIC: ON</button>
            <button id="btn-mute" type="button" title="Mute Sound Effects">SFX: ON</button>
            <button id="btn-fullscreen" type="button" title="Toggle Fullscreen (F11)">FULLSCREEN</button>
          </div>
        </div>

        <div id="touch-controls" aria-hidden="true">
          <div class="touch-cluster touch-left">
            <button type="button" data-action="left" class="t-btn t-wide">&#9664;</button>
            <button type="button" data-action="right" class="t-btn t-wide">&#9654;</button>
          </div>
          <div class="touch-cluster touch-right">
            <div class="touch-row">
              <button type="button" data-action="punchL" class="t-btn t-combat">SWING</button>
              <button type="button" data-action="kick" class="t-btn t-kick">KICK</button>
              <button type="button" data-action="nitro" class="t-btn t-nitro">NITRO</button>
            </div>
            <div class="touch-row">
              <button type="button" data-action="brake" class="t-btn t-brake">BRAKE</button>
              <button type="button" data-action="gas" class="t-btn t-gas">GAS</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
